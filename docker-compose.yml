services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic-receptionist-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:16-alpine
    container_name: clinic-receptionist-postgres
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic_receptionist
    ports:
      - "5432:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clinic-receptionist-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clinic-receptionist-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clinic_postgres_data: